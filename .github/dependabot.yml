version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Revisit the ESLint major upgrade once all installed Next.js plugins support it.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      react-compatible-stack:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      patch-updates:
        exclude-patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
