name: Authenticated isolated order E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/orders/**'
      - 'src/modules/identity/**'
      - 'src/app/api/**'
      - 'scripts/e2e/authenticated-direct-orders.mjs'
      - 'scripts/catalog/export-draft-catalog.mjs'
      - 'scripts/catalog/verify-draft-import.mjs'
      - 'src/modules/catalog/**'
      - 'supabase/migrations/**'
      - '.github/workflows/authenticated-orders.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authenticated-orders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authenticated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start disposable local database and Auth
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then npx --yes supabase@2.122.1 init; fi
          npx --yes supabase@2.122.1 start --help
          npx --yes supabase@2.122.1 start -x studio,imgproxy,logflare,vector,postgres-meta,edge-runtime
          npx --yes supabase@2.122.1 status -o env > "$RUNNER_TEMP/neerva-local.env"
          set -a
          source "$RUNNER_TEMP/neerva-local.env"
          set +a
          [[ "$API_URL" == "http://127.0.0.1:54321" ]]
          [[ "$DB_URL" == *"127.0.0.1:54322/"* ]]
          {
            echo "NEERVA_E2E_LOCAL=yes"
            echo "NEERVA_E2E_DISPOSABLE=yes"
            echo "NEERVA_E2E_SUPABASE_URL=$API_URL"
            echo "NEERVA_E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          node --experimental-strip-types scripts/catalog/export-draft-catalog.mjs
          node scripts/catalog/verify-draft-import.mjs
          node --input-type=module <<'JS'
          import {createClient} from "@supabase/supabase-js";
          import {randomUUID} from "node:crypto";
          import {appendFileSync} from "node:fs";
          import {execFileSync} from "node:child_process";
          const client=createClient(process.env.API_URL,process.env.SERVICE_ROLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
          for(const role of ["CUSTOMER","OTHER_CUSTOMER","ADMIN"]){
            const email=role.toLowerCase()+"-"+randomUUID()+"@example.test";
            const password=randomUUID()+"Aa1!";
            const {data,error}=await client.auth.admin.createUser({email,password,email_confirm:true});
            if(error||!data.user)throw Error("Fixture creation failed: "+role);
            if(role==="ADMIN"){
              const id=data.user.id;
              if(!/^[0-9a-f-]{36}$/.test(id))throw Error("Invalid fixture ID");
              execFileSync("psql",[process.env.DB_URL,"-v","ON_ERROR_STOP=1","-c","insert into public.platform_role_grants(user_id,role) values ('"+id+"','super_admin')"]);
            }
            appendFileSync(process.env.GITHUB_ENV,"NEERVA_E2E_"+role+"_EMAIL="+email+"\nNEERVA_E2E_"+role+"_PASSWORD="+password+"\n");
          }
          JS
      - run: npm run build
      - name: Execute authenticated order lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/authenticated
          npm run start -- -p 3000 > "$RUNNER_TEMP/neerva-auth-e2e.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/e2e/authenticated-direct-orders.mjs | tee test-results/authenticated/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authenticated-order-evidence
          path: |
            test-results/authenticated/
            catalog-sync/summary.json
            catalog-sync/draft-import.sql
          if-no-files-found: ignore
      - name: Destroy local test stack
        if: always()
        run: npx --yes supabase@2.122.1 stop --no-backup
