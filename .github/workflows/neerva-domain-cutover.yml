name: Neerva domain mapping preflight
on:
  push:
    branches: [ops/neerva-domain-cutover]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neerva-domain-cutover
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Vercel credential and old domain mapping without changing anything
        env:
          VERCEL_TOKEN: ${{ secrets.NEERVA_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::NEERVA_VERCEL_TOKEN is not configured in repo Actions Secrets. Domain reassignment cannot run without a scoped Vercel credential."
            exit 1
          fi
          node scripts/ops/migrate-primary-domain.mjs
