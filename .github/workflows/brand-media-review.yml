name: Brand media candidate review
on:
  pull_request:
    paths:
      - 'scripts/catalog/import-brand-media.mjs'
      - 'src/modules/catalog/brand-media.ts'
      - 'src/modules/catalog/brand-pages.ts'
      - 'src/modules/catalog/hardware-references.ts'
      - 'src/modules/catalog/fitting-references.ts'
      - 'src/modules/catalog/failed-media-sources.ts'
      - '.github/workflows/brand-media-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brand-media-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download and decode candidate images for review only
        run: node --experimental-strip-types scripts/catalog/import-brand-media.mjs --review
      - name: Upload candidate files and source report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brand-media-candidates
          path: brand-media-review/
          if-no-files-found: error
          retention-days: 7
