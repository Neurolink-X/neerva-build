name: Neerva mobile browser regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install temporary browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated local preview, test 360–1440px
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > "$RUNNER_TEMP/neerva-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/e2e/mobile-smoke.mjs
      - name: Store mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neerva-mobile-visual-evidence
          path: test-results/mobile/
          if-no-files-found: ignore
          retention-days: 7
