name: Neerva mobile browser regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # Also run on stacked feature PRs before they reach main; no untested architecture can merge.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mobile:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install temporary browser test driver
        run: npm install --prefix "$RUNNER_TEMP/neerva-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.10.2
      - name: Cache Chromium browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.58.2
      - name: Install Chromium
        run: '"$RUNNER_TEMP/neerva-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: npm run release:verify
      - run: npm run test:contracts
      - name: Restore trusted Next.js incremental cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: neerva-next-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            neerva-next-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: Start isolated local preview, test 360–1440px
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > "$RUNNER_TEMP/neerva-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          cp scripts/e2e/mobile-smoke.mjs "$RUNNER_TEMP/neerva-browser/mobile-smoke.mjs"
          cp scripts/release/performance-budget.mjs "$RUNNER_TEMP/neerva-browser/performance-budget.mjs"
          node "$RUNNER_TEMP/neerva-browser/mobile-smoke.mjs"
      - name: Store mobile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neerva-mobile-visual-evidence
          path: test-results/mobile/
          if-no-files-found: ignore
          retention-days: 7
