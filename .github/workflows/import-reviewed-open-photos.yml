name: Import visually reviewed open catalog photos
on:
  push:
    branches: ['feat/catalog-media-integrity', 'fix/catalog-verified-coverage-audit']
    paths: ['scripts/catalog/reviewed-open-photo-sources.json']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Neurolink-X/neerva-build' && (github.ref == 'refs/heads/feat/catalog-media-integrity' || github.ref == 'refs/heads/fix/catalog-verified-coverage-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/catalog/import-reviewed-open-photos.mjs
      - run: node --experimental-strip-types --test src/modules/catalog/catalog-photos.test.ts
      - name: Commit checked local WebP assets to review branch only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/images/catalog/approved/ src/modules/catalog/approved-family-media.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bundle checksum-verified licensed material photographs'
          git push origin "HEAD:${GITHUB_REF}"
