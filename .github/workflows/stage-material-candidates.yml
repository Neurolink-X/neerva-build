name: Stage material photo and brand candidates
on:
  push:
    branches: ['feat/catalog-media-integrity']
    paths: ['scripts/catalog/material-photo-review-candidates.json']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Neurolink-X/neerva-build' && github.ref == 'refs/heads/feat/catalog-media-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/catalog/stage-material-candidates.mjs
      - name: Stage candidate files outside public directory
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/catalog/material-review/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage material photo candidates for manual identity review'
          git push origin HEAD:refs/heads/feat/catalog-media-integrity
