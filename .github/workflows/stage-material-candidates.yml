name: Stage material photo and brand candidates
on:
  pull_request:
    branches: [main]
    paths: ['scripts/catalog/material-photo-review-candidates.json', '.github/workflows/stage-material-candidates.yml']
  push:
    branches: ['feat/catalog-media-integrity']
    paths: ['scripts/catalog/material-photo-review-candidates.json']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'Neurolink-X/neerva-build'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/catalog/stage-material-candidates.mjs
      - name: Upload non-public candidate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-photo-candidates
          path: assets/catalog/material-review/
          retention-days: 7
