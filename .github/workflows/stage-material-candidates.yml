name: Stage material photo and brand candidates
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
    paths: ['scripts/catalog/material-photo-review-candidates.json', '.github/workflows/stage-material-candidates.yml']
  workflow_dispatch:
  push:
    branches: ['feat/catalog-media-integrity']
    paths: ['scripts/catalog/material-photo-review-candidates.json']
# Superseded PR checks must not consume runner time. Manual strict audits stay separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  stage:
    if: ${{ github.repository == 'Neurolink-X/neerva-build' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/catalog/stage-material-candidates.mjs
      - name: Upload non-public candidate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: material-photo-candidates
          path: assets/catalog/material-review/
          retention-days: 7
