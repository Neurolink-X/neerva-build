name: CI

on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate React runtime and types pairing
        run: |
          node scripts/release/react-dependency-pair.mjs
          node --test scripts/release/react-dependency-pair.test.mjs
          node --experimental-strip-types --test src/modules/studio/checkout-status.test.ts
      - run: npm ci --no-audit --no-fund
      - name: Validate installed React peer dependency graph
        run: npm ls react react-dom @types/react @types/react-dom --all
      - name: Full dependency advisory inventory (diagnostic)
        run: |
          npm audit --json > "$RUNNER_TEMP/neerva-dependency-audit.json" || true
          node -e 'const a=require(process.argv[1]); if(a.error || !a.metadata) { console.log("Full advisory inventory unavailable"); } else { console.log("Full dependency advisory counts:",a.metadata.vulnerabilities); }' "$RUNNER_TEMP/neerva-dependency-audit.json"
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run release:verify
      - name: Validate lint toolchain and installed peer graph
        run: |
          node scripts/release/eslint-toolchain.mjs
          node --test scripts/release/eslint-toolchain.test.mjs
          npm ls eslint eslint-config-next next --all
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm test
      - run: npm run build
