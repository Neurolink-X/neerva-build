name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, feat/platform-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version: '24'
          cache: npm
      - name: Validate React runtime and types pairing
        id: pairing
        run: node scripts/release/react-dependency-pair.mjs
      - name: Verify catalog storage and review provenance
        id: storage
        run: node scripts/catalog/audit-storage.mjs
      - name: Install locked dependencies
        id: dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        id: security
        run: npm audit --omit=dev --audit-level=moderate
      - name: Release verification
        id: release
        run: npm run release:verify
      - name: Lint
        id: lint
        run: npm run lint
      - name: Typecheck
        id: types
        run: npm run typecheck
      - name: Contract tests
        id: contracts
        run: npm run test:contracts
      - name: Unit and regression tests
        id: tests
        run: npm test
      - name: Restore trusted Next.js incremental cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: neerva-next-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            neerva-next-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        id: build
        run: npm run build
      - name: Save incremental cache from successful main build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: neerva-next-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
      - name: Record verification outcomes
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          NODE_SETUP: ${{ steps.node.outcome }}
          PAIRING: ${{ steps.pairing.outcome }}
          STORAGE: ${{ steps.storage.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo '## Release verification outcomes'
            for key in CHECKOUT NODE_SETUP PAIRING STORAGE DEPENDENCIES SECURITY RELEASE LINT TYPES CONTRACTS TESTS BUILD; do
              printf '%s: %s\n' "$key" "${!key:-not-run}"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p ci-evidence
          for key in CHECKOUT NODE_SETUP PAIRING STORAGE DEPENDENCIES SECURITY RELEASE LINT TYPES CONTRACTS TESTS BUILD; do
            printf '%s=%s\n' "$key" "${!key:-not-run}"
          done > ci-evidence/outcomes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ci-verification-outcomes
          path: ci-evidence/outcomes.txt
          retention-days: 7
          if-no-files-found: warn
