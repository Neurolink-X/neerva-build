name: CI

on:
  pull_request:
  push:
    branches: [main, feat/platform-foundation]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run release:verify
      - name: Validate lint toolchain and installed peer graph
        run: |
          node scripts/release/eslint-toolchain.mjs
          node --test scripts/release/eslint-toolchain.test.mjs
          npm ls eslint eslint-config-next next --all
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm test
      - run: npm run build
