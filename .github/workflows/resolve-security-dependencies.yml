name: Resolve pinned security dependencies
on:
  push:
    branches: ['feat/catalog-media-integrity']
    paths: ['.github/workflows/resolve-security-dependencies.yml']
permissions:
  contents: write
jobs:
  resolve:
    if: github.repository == 'Neurolink-X/neerva-build' && github.ref == 'refs/heads/feat/catalog-media-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve exact patched versions without dependency scripts
        run: |
          set -euo pipefail
          npm pkg set dependencies.zod=4.6.7 overrides.fflate=0.8.3
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync("package.json")),l=JSON.parse(fs.readFileSync("package-lock.json"));assert.equal(p.dependencies.zod,"4.6.7");assert.equal(p.overrides.fflate,"0.8.3");for(const [path,v] of Object.entries(l.packages)){if(path.endsWith("/zod"))assert.equal(v.version,"4.6.7");if(path.endsWith("/fflate"))assert.equal(v.version,"0.8.3");}'
          npm audit --omit=dev --audit-level=moderate
      - name: Commit only package manifest and lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pin patched Zod and fflate with registry-generated lockfile'
          git push origin HEAD:refs/heads/feat/catalog-media-integrity
