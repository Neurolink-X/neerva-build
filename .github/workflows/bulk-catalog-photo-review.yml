name: Bulk catalog photo candidate review
on:
  pull_request:
    branches: [main]
    paths: ['scripts/catalog/bulk-photo-*.mjs', '.github/workflows/bulk-catalog-photo-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.repository == 'Neurolink-X/neerva-build' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/catalog/bulk-photo-policy.test.mjs
      - run: node --experimental-strip-types scripts/catalog/bulk-photo-discovery.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bulk-catalog-photo-review
          path: catalog-bulk-review/
          retention-days: 7
