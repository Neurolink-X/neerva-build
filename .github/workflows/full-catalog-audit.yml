name: Full catalog integrity audit
on:
  workflow_dispatch:
    inputs:
      strict:
        description: Require complete coverage and no remaining logo or resolution issues
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - 'src/modules/catalog/**'
      - 'scripts/catalog/**'
      - 'scripts/ops/prepare-image-optimizations.mjs'
      - 'public/images/catalog/**'
      - 'assets/catalog/**'
      - 'package-lock.json'
      - '.github/workflows/full-catalog-audit.yml'
# Superseded PR checks must not consume runner time. Manual strict audits stay separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  audit:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit local files, variants and release coverage
        env:
          STRICT_CATALOG: ${{ inputs.strict }}
        run: |
          if [ "$STRICT_CATALOG" = "true" ]; then
            node --experimental-strip-types scripts/catalog/full-catalog-audit.mjs --strict
          else
            node --experimental-strip-types scripts/catalog/full-catalog-audit.mjs
          fi
      - name: Stage large image optimization candidates (review only)
        run: |
          mkdir -p "$RUNNER_TEMP/neerva-image-review"
          TMPDIR="$RUNNER_TEMP/neerva-image-review" node scripts/ops/prepare-image-optimizations.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neerva-image-optimization-candidates
          path: ${{ runner.temp }}/neerva-image-review/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: full-catalog-audit
          path: catalog-audit/report.json
          retention-days: 14
