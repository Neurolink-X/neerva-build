name: Full catalog integrity audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/catalog/**'
      - 'scripts/catalog/**'
      - '.github/workflows/full-catalog-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types scripts/catalog/full-catalog-audit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: full-catalog-audit
          path: catalog-audit/report.json
          retention-days: 14
