name: Full catalog integrity audit
on:
  workflow_dispatch:
    inputs:
      strict:
        description: Require complete coverage and no remaining logo or resolution issues
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/catalog/**'
      - 'scripts/catalog/**'
      - 'public/images/catalog/**'
      - 'assets/catalog/**'
      - 'package-lock.json'
      - '.github/workflows/full-catalog-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit local files, variants and release coverage
        env:
          STRICT_CATALOG: ${{ inputs.strict }}
        run: |
          if [ "$STRICT_CATALOG" = "true" ]; then
            node --experimental-strip-types scripts/catalog/full-catalog-audit.mjs --strict
          else
            node --experimental-strip-types scripts/catalog/full-catalog-audit.mjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-catalog-audit
          path: catalog-audit/report.json
          retention-days: 14
